name: Check links

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book
        run: quarto render

      - name: Check rendered links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --cache
            --max-cache-age 1d
            --no-progress
            --root-dir "${{ github.workspace }}/_book"
            "_book/**/*.html"
